name: Budowanie GENBLOCK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Javę 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Buduj plugin
        run: mvn -f GenBlock-2.0-source/pom.xml clean package

      - name: Zapisz plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: GenBlock-JAR
          path: GenBlock-2.0-source/target/*.jar
